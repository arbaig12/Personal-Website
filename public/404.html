<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0f172a;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      overflow: hidden;
    }

    /* Orb background */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
    }
    .orb1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(30,64,175,0.25), transparent 70%);
      top: -150px; left: -100px;
      animation: drift1 28s ease-in-out infinite alternate;
    }
    .orb2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(8,145,178,0.2), transparent 70%);
      bottom: -80px; right: -80px;
      animation: drift2 35s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(60px, 50px); } }
    @keyframes drift2 { to { transform: translate(-50px, -60px); } }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    .code {
      font-size: clamp(6rem, 18vw, 10rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      background: linear-gradient(135deg, #f1f5f9 30%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 0.7s ease both;
    }

    .msg {
      font-size: 1.1rem;
      color: #94a3b8;
      font-weight: 400;
      animation: fadeUp 0.7s ease 0.15s both;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding: 0.6rem 1.4rem;
      background: rgba(56,189,248,0.12);
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 8px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s ease, box-shadow 0.2s ease;
      animation: fadeUp 0.7s ease 0.3s both;
    }
    .home-link:hover {
      background: rgba(56,189,248,0.2);
      box-shadow: 0 0 20px rgba(56,189,248,0.15);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="content">
    <div class="code">404</div>
    <p class="msg">This page doesn't exist — maybe it never did.</p>
    <a class="home-link" href="/Personal-Website/">← Back to Home</a>
  </div>
</body>
</html>
